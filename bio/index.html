<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 꿀템 모음</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #fff0f3 0%, #fff8f0 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 460px; padding: 36px 18px 28px; }
  .header { text-align: center; margin-bottom: 28px; }
  .header .emoji { font-size: 38px; display: block; margin-bottom: 6px; }
  .header h1 { font-size: 21px; color: #3a2c2c; margin: 0 0 6px; font-weight: 800; letter-spacing: -0.3px; }
  .header p { font-size: 13px; color: #a08d8d; margin: 0; }
  .link-card { position: relative; display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 18px; padding: 12px 16px 12px 12px; margin-bottom: 12px; text-decoration: none; color: #333; box-shadow: 0 3px 14px rgba(255, 150, 170, 0.14); transition: transform .12s ease, box-shadow .12s ease; }
  .link-card:active { transform: scale(0.97); }
  .thumb-wrap { position: relative; flex-shrink: 0; }
  .thumb { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; background: #f5eeee; display: block; }
  .thumb-placeholder { display: flex; align-items: center; justify-content: center; font-size: 24px; color: #ccb8b8; background: #fbeff1; }
  .num { position: absolute; bottom: -6px; right: -6px; background: #ff8fa3; color: #fff; font-weight: 800; font-size: 11px; width: 20px; height: 20px; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .title { font-size: 14.5px; font-weight: 600; color: #3a2c2c; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { font-size: 13px; font-weight: 700; color: #ff6f8e; }
  .chevron { color: #e3c9c9; font-size: 20px; flex-shrink: 0; }
  .new-badge { position: absolute; top: -7px; left: 10px; background: #3a2c2c; color: #fff; font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 999px; letter-spacing: 0.5px; }
  .empty { text-align: center; color: #b39a9a; font-size: 14px; padding: 40px 0; }
  footer { text-align: center; color: #c2adad; font-size: 11px; margin-top: 26px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <span class="emoji">🛒</span>
    <h1>오늘의 꿀템 모음</h1>
    <p>번호 눌러서 바로 구매하러 가기</p>
  </div>
  
      <a class="link-card" href="https://link.coupang.com/a/fSAmRQtx1M" target="_blank" rel="noopener sponsored">
        <div class="thumb-wrap">
          <img class="thumb" src="https://kjh15923.github.io/shopping-short/frames/2026-08-02-4-actual.jpg" alt="델리 전동 자동 연필깎이" loading="lazy">
          <span class="num">2</span>
        </div>
        <div class="info">
          <span class="title">델리 전동 자동 연필깎이</span>
          
        </div>
        <span class="new-badge">NEW</span>

</div>
</body>
</html>
