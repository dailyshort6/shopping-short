<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #fff0f3 0%, #fff8f0 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 460px; padding: 36px 18px 28px; }

  .header { text-align: center; margin-bottom: 30px; }
  .header .emoji { font-size: 42px; display: block; margin-bottom: 8px; }
  .header h1 {
    font-size: 25px; color: #3a2c2c; margin: 0 0 8px;
    font-weight: 800; letter-spacing: -0.3px;
  }
  .header p { font-size: 15px; color: #a08d8d; margin: 0; }

  .link-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border-radius: 18px;
    padding: 14px 18px 14px 12px;
    margin-bottom: 14px;
    text-decoration: none;
    color: #333;
    box-shadow: 0 3px 14px rgba(255, 150, 170, 0.14);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .link-card:active { transform: scale(0.97); }

  .thumb-wrap { position: relative; flex-shrink: 0; }
  .thumb {
    width: 66px; height: 66px; border-radius: 14px;
    object-fit: cover; background: #f5eeee; display: block;
  }
  .thumb-placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #ccb8b8; background: #fbeff1;
  }

  .info { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
  .num-pill {
    display: inline-block; align-self: flex-start;
    background: #ff8fa3; color: #fff; font-weight: 800; font-size: 13px;
    padding: 4px 11px; border-radius: 999px; letter-spacing: -0.2px;
  }
  .title {
    font-size: 17px; font-weight: 700; color: #3a2c2c; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .price { font-size: 15.5px; font-weight: 800; color: #ff6f8e; }

  .chevron { color: #e3c9c9; font-size: 22px; flex-shrink: 0; }

  .new-badge {
    position: absolute; top: -8px; left: 10px;
    background: #3a2c2c; color: #fff; font-size: 11px; font-weight: 800;
    padding: 4px 10px; border-radius: 999px; letter-spacing: 0.5px;
  }

  .empty { text-align: center; color: #b39a9a; font-size: 15px; padding: 40px 0; }

  footer {
    text-align: center; color: #b39a9a; font-size: 12.5px;
    margin-top: 28px; line-height: 1.7;
  }
</style>
